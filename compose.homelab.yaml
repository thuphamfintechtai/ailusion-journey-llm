# LLM homelab: Redis 8 + Postgres pgvector + API của riêng repo này.
# Compose dev (docker-compose.yml) không đổi.
#
# Cần mạng dùng chung (một lần trên máy): docker network create ailusion
# MCP phải có alias "mcp" trên mạng đó. Backend gọi alias "llm".
#
#   cp .env.homelab.example .env.homelab
#   docker compose --env-file .env.homelab -f compose.homelab.yaml up -d --build

name: ailusion-llm

services:
  redis:
    image: redis:8.2
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6381}:6379"
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      - traefik.enable=false

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ailusion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.homelab}
      POSTGRES_DB: ${POSTGRES_DB:-ailusion}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      - traefik.enable=false

  api:
    build: .
    image: ailusion-journey-llm:homelab
    container_name: ailusion-llm
    restart: unless-stopped
    environment:
      APP_ENV: production
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env.homelab}
      LLM_MODEL: ${LLM_MODEL:-openai:gpt-4.1-mini}
      LLM_FORM_MODEL: ${LLM_FORM_MODEL:-openai:gpt-4.1-nano}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-ailusion-journey}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_TRACING_ENVIRONMENT: production
      LANGFUSE_SAMPLE_RATE: ${LANGFUSE_SAMPLE_RATE:-1.0}
      PII_MASKING: "true"
      REDIS_URL: redis://redis:6379/0
      CHECKPOINT_TTL_MINUTES: "1440"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: ${POSTGRES_DB:-ailusion}
      PG_USER: ${POSTGRES_USER:-ailusion}
      PG_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.homelab}
      PG_SSLMODE: prefer
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai:text-embedding-3-small}
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-1536}
      MCP_URL: http://mcp:8002/mcp
      SERVICE_API_KEY: ${SERVICE_API_KEY:?set SERVICE_API_KEY in .env.homelab}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      default: {}
      ailusion:
        aliases:
          - llm
    labels:
      - traefik.enable=false

networks:
  ailusion:
    external: true
    name: ailusion

volumes:
  redis-data:
  pg-data:
