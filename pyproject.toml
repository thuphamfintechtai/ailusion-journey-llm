[project]
name = "ailusion-journey-llm"
version = "0.1.0"
description = "Hệ đa-agent lập kế hoạch du lịch (LangGraph) — hạ tầng"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Orchestration
    "langgraph>=1.2,<2",
    "langchain>=1.4,<2",            # cần cho Langfuse LangChain integration + init_embeddings
    "langchain-core>=1.6,<2",
    # Hai nhà cung cấp LLM dùng trong dự án: Gemini và OpenAI (không dùng Anthropic).
    "langchain-google-genai>=2.1",
    "langchain-openai>=1.6,<2",
    # Observability
    "langsmith>=0.14",
    "langfuse>=4.16,<5",
    # Bộ nhớ ngắn hạn (Redis) / dài hạn (Postgres)
    "langgraph-checkpoint-redis>=0.5.2,<0.6",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "psycopg[binary,pool]>=3.3",
    "redis>=6",
    # Config & HTTP
    "pydantic-settings>=2.15",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    # API cho backend gọi vào
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "langchain-mcp-adapters>=0.2",
]

[dependency-groups]
dev = [
    "fakeredis>=2.39.0",
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ailusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
"src/ailusion/prompts/*" = ["E501"]  # văn bản prompt, không ngắt giữa câu
