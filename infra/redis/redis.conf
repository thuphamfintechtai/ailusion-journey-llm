# Redis cho bộ nhớ ngắn hạn + cache tool + stream nhật ký agent.
# Module (search, json, ...) do entrypoint của image redis:8 tự nạp.

bind 0.0.0.0
port 6379
# Port host đã bind vào 127.0.0.1 trong docker-compose, nên tắt protected-mode
# để container khác (RedisInsight) kết nối được qua mạng docker.
protected-mode no

# --- Bền vững ---
# AOF để checkpoint / chuỗi what-if còn nguyên khi restart container.
appendonly yes
appendfsync everysec
dir /data

# --- Bộ nhớ ---
# noeviction: KHÔNG để Redis tự xoá key khi đầy, vì xoá mất một checkpoint là hỏng
# trạng thái graph. Việc dọn dẹp do TTL đảm nhiệm (checkpoint, cache, stream đều có TTL).
# Khi chạm maxmemory, lệnh ghi sẽ báo lỗi ngay -> dễ phát hiện hơn mất dữ liệu âm thầm.
maxmemory 1gb
maxmemory-policy noeviction

# Index của Query Engine chỉ hoạt động trên DB 0 -> dùng chung DB 0, tách bằng tiền tố key:
#   checkpoint* / checkpoint_write*  (langgraph-checkpoint-redis)
#   toolcache:<tool>:<hash>          (cache kết quả tool)
#   agentlog:<thread_id>             (Redis Stream nhật ký agent)
